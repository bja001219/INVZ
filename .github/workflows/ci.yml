name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# No OPENAI_API_KEY or KIE_API_KEY is defined anywhere in this workflow. Every job runs in
# Mock mode, and pytest-socket fails the suite on any unregistered outbound request.
env:
  GENERATION_MODE: mock

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check app tests
      - run: mypy app
      - run: python -m pytest tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
